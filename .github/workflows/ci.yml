name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests scripts tools
      - run: uv run pytest -q
      - run: uv run python scripts/run_eval.py
      - run: uv run python tools/tamper_demo.py
      - run: uv run python -m cagematch.cli --version
