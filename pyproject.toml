[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cagematch"
version = "0.1.0"
description = "Evidence-locked arena for agent harnesses: run the same task suite across providers and harnesses, score cost/latency/tool-accuracy/failures, and prove the score by replaying persisted traces."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arees Manesia" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cagematch = "cagematch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cagematch = ["tasks/*.json", "tasks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
